name: ORBIT Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Publish unsigned installer
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORBIT-Setup-*-x64.exe
          generate_release_notes: true
          body: |
            ORBIT Desktop Windows x64 installer.

            **Code signing policy:** https://github.com/Nin01234/ORBIT-Desktop/blob/main/CODE_SIGNING_POLICY.md

            **Signing status:** This release is unsigned. The SignPath Foundation application has not yet been approved.
