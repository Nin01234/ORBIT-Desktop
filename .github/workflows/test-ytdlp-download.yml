name: Test ORBIT desktop

on:
  push:
    branches:
      - test/ytdlp-ffmpeg-downloads
  pull_request:
    branches:
      - test/ytdlp-ffmpeg-downloads

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm test
